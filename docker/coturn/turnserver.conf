# coturn config for local development.
# Time-limited credentials (TURN REST API): the backend signs usernames with this secret.
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=change-me-turn-secret
realm=mtalk.local
min-port=49160
max-port=49200
no-multicast-peers
no-cli
# Block relaying to private ranges so the TURN server cannot be used to reach internal networks.
# (Loopback is left allowed so local-dev calls between two browser tabs still work.)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
